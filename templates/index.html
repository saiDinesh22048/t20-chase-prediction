<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>T20 Chase Prediction</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/css/main.css">
</head>
<body>
  <div class="container px-4">
    <h1 class="text-center mb-2 display-3 fw-bold">🏏 T20 Chase Prediction</h1>
    <p class="text-center text-muted mb-5 fs-5">Fill in the second innings data to predict the chase outcome.</p>

    <form action="/predict" method="POST" class="max-w-xl mx-auto p-4 p-md-5 rounded-3 glass">
      <div class="mb-4 position-relative">
        <label for="runs_from_ball" class="form-label">
          Runs From Ball
          <span class="info-icon ms-1" title="Runs scored on the current ball (0-7, e.g., 1, 4, 6)">ℹ️</span>
        </label>
        <input type="number" step="any" name="runs_from_ball" placeholder="e.g., 1" required class="form-control">
      </div>
      
      <div class="mb-4 position-relative">
        <label for="innings_runs" class="form-label">
          Innings Runs
          <span class="info-icon ms-1" title="Total runs scored by the team so far (0-250)">ℹ️</span>
        </label>
        <input type="number" step="any" name="innings_runs" placeholder="e.g., 100" required class="form-control">
      </div>
      
      <div class="mb-4 position-relative">
        <label for="innings_wickets" class="form-label">
          Innings Wickets
          <span class="info-icon ms-1" title="Wickets lost by the team (0-10)">ℹ️</span>
        </label>
        <input type="number" step="any" name="innings_wickets" placeholder="e.g., 3" required class="form-control">
      </div>
      
      <div class="mb-4 position-relative">
        <label for="balls_remaining" class="form-label">
          Balls Remaining
          <span class="info-icon ms-1" title="Balls left in the innings (1-119)">ℹ️</span>
        </label>
        <input type="number" step="any" name="balls_remaining" placeholder="e.g., 60" required class="form-control">
      </div>
      
      <div class="mb-4 position-relative">
        <label for="target_score" class="form-label">
          Target Score
          <span class="info-icon ms-1" title="Total runs needed to win (50-250)">ℹ️</span>
        </label>
        <input type="number" step="any" name="target_score" placeholder="e.g., 180" required class="form-control">
      </div>
      
      <div class="mb-4 position-relative">
        <label for="total_batter_runs" class="form-label">
          Total Batter Runs
          <span class="info-icon ms-1" title="Runs scored by the current batter (0-100+)">ℹ️</span>
        </label>
        <input type="number" step="any" name="total_batter_runs" placeholder="e.g., 45" required class="form-control">
      </div>
      
      <div class="mb-4 position-relative">
        <label for="total_non_striker_runs" class="form-label">
          Total Non Striker Runs
          <span class="info-icon ms-1" title="Runs scored by the non-striker (0-100+)">ℹ️</span>
        </label>
        <input type="number" step="any" name="total_non_striker_runs" placeholder="e.g., 20" required class="form-control">
      </div>
      
      <div class="mb-4 position-relative">
        <label for="batter_balls_faced" class="form-label">
          Batter Balls Faced
          <span class="info-icon ms-1" title="Balls faced by the current batter (0-60+)">ℹ️</span>
        </label>
        <input type="number" step="any" name="batter_balls_faced" placeholder="e.g., 30" required class="form-control">
      </div>
      
      <div class="mb-4 position-relative">
        <label for="non_striker_balls_faced" class="form-label">
          Non Striker Balls Faced
          <span class="info-icon ms-1" title="Balls faced by the non-striker (0-60+)">ℹ️</span>
        </label>
        <input type="number" step="any" name="non_striker_balls_faced" placeholder="e.g., 15" required class="form-control">
      </div>

      <!-- Error handling placeholder -->
      <div id="error-message" class="error-message d-none mb-4"></div>

      <button type="submit" class="w-100 btn btn-primary py-3 fs-5">
        🔍 Predict Chase Outcome
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/main.js"></script>
</body>
</html>
