<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prediction Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/css/main.css">
</head>
<body>
  <div class="container px-4">
    <h1 class="text-center mb-5 display-2 fw-bold">🏆 Prediction Result</h1>

    <div class="max-w-md mx-auto glass p-4 p-md-5 rounded-4 text-center">
      <p class="fs-1 fw-medium mb-3">
        Prediction:
        <span id="prediction-text" class="prediction-success">Chase Successful</span>
      </p>
      <p class="fs-4 text-muted mb-5">
        Probability of Success:
        <span id="probability-text" class="probability">85.50%</span>
      </p>

      <a href="/" class="btn btn-primary">
        🔁 Make Another Prediction
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/main.js"></script>
</body>
</html>
